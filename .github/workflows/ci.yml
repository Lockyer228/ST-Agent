name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync locked dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src tests app.py
      - name: Pytest
        run: uv run pytest -q
