[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "st-agent"
version = "0.1.0"
description = "Local application that turns English story ideas into SillyTavern character cards and lorebooks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "pillow",
    "pydantic",
    "strands-agents[openai]",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
